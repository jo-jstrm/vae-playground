# VAE Training Configuration

# Model hyperparameters
model:
  img_size: 32
  input_dim: 3
  hidden_dims: [16, 32, 64]
  latent_dim: 64

# Training hyperparameters
training:
  num_epochs: 1000
  batch_size: 512
  num_workers: 2
  learn_rate: 0.001
  val_freq: 100
  checkpoint_freq: 1000

# Data configuration
data:
  overfit: false
  train_split: 0.8

# Testing configuration
testing:
  batch_size: 512
  num_workers: 2
